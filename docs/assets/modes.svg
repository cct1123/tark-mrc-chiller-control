<svg xmlns="http://www.w3.org/2000/svg" width="960" height="385" viewBox="0 0 960 385" role="img" aria-labelledby="title desc">
<title id="title">Same Chiller API, two backend paths</title><desc id="desc">Simulator works without hardware. SerialDevice requires an authoritative codec before it can open any port.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#536c79"/></marker></defs>
<rect width="960" height="385" rx="14" fill="#f5f8fa"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#18313d">
<text x="30" y="36" font-size="22" font-weight="600">Same Chiller API, two backend paths</text>
<path d="M420 145V190H230V222" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 145V190H730V222" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="74" width="260" height="72" rx="8" fill="#e5f4f2" stroke="#087f8c" stroke-width="1.5"/><text x="480" y="103" text-anchor="middle" font-size="20">Chiller</text><text x="480" y="128" text-anchor="middle" font-size="15" fill="#536c79">The application-facing API</text><rect x="90" y="227" width="280" height="72" rx="8" fill="#e5f4f2" stroke="#087f8c" stroke-width="1.5"/><text x="230" y="256" text-anchor="middle" font-size="20">Simulator</text><text x="230" y="281" text-anchor="middle" font-size="15" fill="#536c79">Available without hardware</text><rect x="590" y="227" width="280" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="730" y="256" text-anchor="middle" font-size="20">SerialDevice</text><text x="730" y="281" text-anchor="middle" font-size="15" fill="#536c79">Documented codec required</text><text x="230" y="330" text-anchor="middle" font-size="16">No port, cable or GUI needed</text>
<text x="730" y="330" text-anchor="middle" font-size="16" fill="#a75019">Blocked before port opening</text>
<text x="30" y="369" font-size="16" fill="#536c79">RS-232 / RS-485 settings and commands must match the actual controller and adapter.</text>
</g></svg>
