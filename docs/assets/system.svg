<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">One driver owns device access</title><desc id="desc">An experiment uses Chiller, which owns the backend and optional monitoring. The monitor supplies CSV and optional Dash snapshots.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#536c79"/></marker></defs>
<rect width="960" height="350" rx="14" fill="#f5f8fa"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#18313d">
<text x="30" y="36" font-size="22" font-weight="600">One driver owns device access</text>
<path d="M250 126H355" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 126H705" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 162V246" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><path d="M355 286H255" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 286H705" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="90" width="215" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="142.5" y="119" text-anchor="middle" font-size="20">Your experiment</text><text x="142.5" y="144" text-anchor="middle" font-size="15" fill="#536c79">Script or application</text><rect x="360" y="90" width="240" height="72" rx="8" fill="#e5f4f2" stroke="#087f8c" stroke-width="1.5"/><text x="480" y="119" text-anchor="middle" font-size="20">Chiller</text><text x="480" y="144" text-anchor="middle" font-size="15" fill="#536c79">Connect · read · set · stop</text><rect x="710" y="90" width="215" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="817.5" y="119" text-anchor="middle" font-size="20">Backend</text><text x="817.5" y="144" text-anchor="middle" font-size="15" fill="#536c79">Simulator or SerialDevice</text><rect x="360" y="250" width="240" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="480" y="279" text-anchor="middle" font-size="20">Optional monitoring</text><text x="480" y="304" text-anchor="middle" font-size="15" fill="#536c79">Started explicitly by Chiller</text><rect x="35" y="250" width="215" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="142.5" y="279" text-anchor="middle" font-size="20">Optional Dash</text><text x="142.5" y="304" text-anchor="middle" font-size="15" fill="#536c79">Reads snapshots</text><rect x="710" y="250" width="215" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="817.5" y="279" text-anchor="middle" font-size="20">Optional CSV</text><text x="817.5" y="304" text-anchor="middle" font-size="15" fill="#536c79">New file per run</text><text x="490" y="211" font-size="16" fill="#536c79">Owns lifecycle</text>
</g></svg>
