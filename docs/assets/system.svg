<g font-family="Segoe UI,Arial,sans-serif" fill="#18313d">
<text x="30" y="36" font-size="22" font-weight="600">One driver, optional monitoring and display</text>
<g fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)">
<path d="M245 126H345"/><path d="M610 126H700"/>
<path d="M480 172V267"/><path d="M350 316H250"/><path d="M610 316H700"/>
<path d="M140 272V212H400V177" stroke-dasharray="6 4"/>
</g>
<g fill="#fff" stroke="#c6d4dc" stroke-width="1.5">
<rect x="35" y="82" width="210" height="90" rx="8"/>
<rect x="350" y="82" width="260" height="90" rx="8" fill="#e5f4f2" stroke="#087f8c"/>
<rect x="705" y="82" width="220" height="90" rx="8"/>
