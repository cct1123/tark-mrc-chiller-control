<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" role="img" aria-labelledby="title desc">
<title id="title">One driver, optional monitoring and display</title>
<desc id="desc">An experiment uses Chiller with a documented serial backend or a development simulator. Chiller owns optional monitoring. The worker reads through Chiller, retains bounded snapshots and writes CSV. Dash reads snapshots and submits explicit targets through Chiller validation.</desc>
