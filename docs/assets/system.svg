<text x="480" y="113" font-size="22">Chiller</text>
<text x="480" y="137" font-size="15">Connect · read · validated set</text>
<text x="480" y="157" font-size="15">Owns connection and shutdown</text>
<text x="815" y="110" font-size="20">Backend</text>
<text x="815" y="134" font-size="15">SerialDevice + codec</text>
<text x="815" y="155" font-size="14">or Simulator for development</text>
<text x="140" y="309" font-size="20">Optional Dash</text>
<text x="140" y="336" font-size="15">Display snapshots</text>
<text x="480" y="302" font-size="20">Optional monitoring</text>
