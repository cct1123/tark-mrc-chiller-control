<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
<title id="title">Acquisition continues without the browser</title><desc id="desc">Chiller readings flow into one optional worker, then CSV and bounded snapshots. Dash reads snapshots and sends explicit validated setpoints through Chiller.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#536c79"/></marker></defs>
<rect width="960" height="370" rx="14" fill="#f5f8fa"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#18313d">
<text x="30" y="36" font-size="22" font-weight="600">Acquisition continues without the browser</text>
<path d="M270 117H350" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 117H690" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 153V246" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 287H690" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 323V348H140V153" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><rect x="30" y="81" width="240" height="72" rx="8" fill="#e5f4f2" stroke="#087f8c" stroke-width="1.5"/><text x="150" y="110" text-anchor="middle" font-size="20">Chiller readings</text><text x="150" y="135" text-anchor="middle" font-size="15" fill="#536c79">Sequential device reads</text><rect x="355" y="81" width="255" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="482.5" y="110" text-anchor="middle" font-size="20">Monitoring worker</text><text x="482.5" y="135" text-anchor="middle" font-size="15" fill="#536c79">One optional polling loop</text><rect x="695" y="81" width="235" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="812.5" y="110" text-anchor="middle" font-size="20">CSV file</text><text x="812.5" y="135" text-anchor="middle" font-size="15" fill="#536c79">Write and flush each row</text><rect x="355" y="251" width="255" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="482.5" y="280" text-anchor="middle" font-size="20">monitor.snapshot()</text><text x="482.5" y="305" text-anchor="middle" font-size="15" fill="#536c79">Bounded, immutable history</text><rect x="695" y="251" width="235" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="812.5" y="280" text-anchor="middle" font-size="20">Dash display</text><text x="812.5" y="305" text-anchor="middle" font-size="15" fill="#536c79">Refresh reads memory</text><text x="490" y="214" font-size="16" fill="#536c79">Publish samples and counters</text>
<text x="230" y="340" font-size="15" fill="#536c79">Explicit target request → driver validation → one write</text>
</g></svg>
