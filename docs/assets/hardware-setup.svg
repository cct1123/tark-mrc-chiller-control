<g font-family="Segoe UI,Arial,sans-serif" fill="#18313d">
<text x="30" y="36" font-size="22" font-weight="600">Physical setup requires matching documentation</text>
<path d="M265 126H355" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)"/><path d="M605 126H695" fill="none" stroke="#536c79" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="90" width="235" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="147.5" y="119" text-anchor="middle" font-size="20">Computer</text><text x="147.5" y="144" text-anchor="middle" font-size="15" fill="#536c79">Recorded OS port</text><rect x="360" y="90" width="245" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="482.5" y="119" text-anchor="middle" font-size="20">Verified adapter</text><text x="482.5" y="144" text-anchor="middle" font-size="15" fill="#536c79">Actual RS-232 / RS-485 mode</text><rect x="700" y="90" width="230" height="72" rx="8" fill="#fff" stroke="#c6d4dc" stroke-width="1.5"/><text x="815" y="119" text-anchor="middle" font-size="20">Identified MRC</text><text x="815" y="144" text-anchor="middle" font-size="15" fill="#536c79">Controller model + firmware</text><text x="480" y="203" text-anchor="middle" font-size="18" fill="#a75019">Missing communication manual → no codec → no port opening</text>
<text x="30" y="235" font-size="15" fill="#536c79">Connection plan only. This drawing supplies no pinout, cable wiring or electrical settings.</text>
