[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tark-mrc-chiller"
version = "0.7.0"
description = "Laboratory chiller driver with CAL 3300/9300 and ThermoTek T255P protocols"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
gui = ["dash>=3.0.4,<5", "plotly>=6,<7", "dash-bootstrap-components>=2.0.4,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "mypy>=1.15,<2", "types-pyserial>=3.5"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[project.scripts]
tark-chiller = "tark_chiller.simulator:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["tark_chiller"]
namespaces = true

[tool.setuptools.package-data]
tark_chiller = ["py.typed", "assets/*.css", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/tark_chiller"]
explicit_package_bases = true
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["plotly.*", "dash_bootstrap_components"]
ignore_missing_imports = true
